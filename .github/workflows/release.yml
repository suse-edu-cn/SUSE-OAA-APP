name: Release on Version Update

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'androidApp/build.gradle.kts'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if Version Changed
        id: check_version
        run: |
          VERSION_NAME=$(grep 'versionName =' androidApp/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          echo "当前代码中的 versionName: $VERSION_NAME"

          if [ -z "$VERSION_NAME" ]; then
            echo "未能提取到 versionName，退出。"
            exit 1
          fi

          TAG_NAME="v$VERSION_NAME"

          if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME"; then
            echo "Tag $TAG_NAME 已经存在，说明版本没有更新或已发版，跳过后续操作。"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "检测到新版本，将构建并发布 $TAG_NAME。"
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        if: steps.check_version.outputs.changed == 'true'
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "没有找到上一个 tag，获取所有提交记录。"
            LOGS=$(git log --no-merges --pretty=format:"%s")
          else
            echo "上一个 tag: $PREV_TAG"
            LOGS=$(git log $PREV_TAG..HEAD --no-merges --pretty=format:"%s")
          fi

          FEATS=""
          FIXES=""

          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ $line =~ ^feat:[[:space:]]*(.*) ]]; then
              FEATS+="- ${BASH_REMATCH[1]}"$'\n'
            elif [[ $line =~ ^fix:[[:space:]]*(.*) ]]; then
              FIXES+="- ${BASH_REMATCH[1]}"$'\n'
            elif [[ $line =~ ^tmp: ]]; then
              continue
            fi
          done <<< "$LOGS"

          CHANGELOG=""
          if [ -n "$FEATS" ]; then
            CHANGELOG+="### 功能"$'\n'"$FEATS"$'\n'
          fi
          if [ -n "$FIXES" ]; then
            CHANGELOG+="### 修复"$'\n'"$FIXES"$'\n'
          fi

          echo "$CHANGELOG" > changelog.txt
          cat changelog.txt

      # -------------------------------------------------------
      # 修复1：Java 版本与 jvmToolchain(25) 对齐，使用 JDK 25
      # -------------------------------------------------------
      - name: Setup Java
        if: steps.check_version.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      # -------------------------------------------------------
      # 修复2：安装 NDK 27.0.12077973（androidApp 指定的版本）
      # ubuntu-latest 默认不带该 NDK，CMakeLists.txt 编译 native
      # 库（suseoaa_litert_preload / LiteRtTopKOpenClSampler）时
      # 必须有对应 NDK 才能成功。
      # -------------------------------------------------------
      - name: Setup Android NDK
        if: steps.check_version.outputs.changed == 'true'
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.0.12077973
        if: steps.check_version.outputs.changed == 'true'
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Decode Keystore
        if: steps.check_version.outputs.changed == 'true'
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $ENCODED_KEYSTORE | base64 -d > $RUNNER_TEMP/keystore.jks

      # -------------------------------------------------------
      # 修复3：移除多余的 :androidApp:minifyReleaseWithR8
      # assembleRelease 已经内含 R8 混淆步骤，重复调用会报错
      # "Task 'minifyReleaseWithR8' not found"。
      # -------------------------------------------------------
      - name: Build Release APK
        if: steps.check_version.outputs.changed == 'true'
        env:
          KEYSTORE_FILE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :androidApp:assembleRelease

          APK_DIR="androidApp/build/outputs/apk/release"
          TAG="${{ steps.check_version.outputs.tag }}"

          # -------------------------------------------------------
          # 修复4：只重命名第一个 apk，防止 while 循环把已重命名的
          # 文件再次覆盖自身（原先多文件时会出现竞争问题）。
          # -------------------------------------------------------
          SRC_APK=$(find "$APK_DIR" -name "*.apk" | head -n 1)
          if [ -n "$SRC_APK" ]; then
            mv "$SRC_APK" "$APK_DIR/青蟹-${TAG}.apk"
          fi

      - name: Publish GitHub Release
        if: steps.check_version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.tag }}
          name: 青蟹 ${{ steps.check_version.outputs.tag }}
          body_path: changelog.txt
          files: androidApp/build/outputs/apk/release/青蟹-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}